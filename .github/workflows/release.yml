name: Release

on:
  push:
    tags: ["v*"]
    # A merge that bumps the version releases it: the tag is created here.
    branches: [main]
    paths: [Cargo.toml]
  # Manual run: releases the version from Cargo.toml and creates its tag
  # on the selected commit.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Version to release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Is this version released yet
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if gh release view "v$version" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            if [ "${{ github.ref_type }}" = "branch" ] && [ "${{ github.event_name }}" = "push" ]; then
              echo "v$version уже выпущена, релиз не нужен"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Релиз v$version уже существует"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    name: GitHub Release
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      - name: Tag matches Cargo.toml
        id: version
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            if ($tag -ne "v$version") { throw "Тег $tag не совпадает с версией в Cargo.toml ($version)" }
          } else {
            $tag = "v$version"
            git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
            if ($LASTEXITCODE -eq 0) { throw "Тег $tag уже существует" }
            $global:LASTEXITCODE = 0
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/scarp-wallpaper.exe dist/
          $hash = (Get-FileHash dist/scarp-wallpaper.exe -Algorithm SHA256).Hash.ToLower()
          # sha256sum format: `sha256sum -c scarp-wallpaper.exe.sha256`
          "$hash  scarp-wallpaper.exe" | Set-Content -NoNewline -Encoding ascii dist/scarp-wallpaper.exe.sha256
          "SHA256: $hash"

      - name: Release notes
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
          if (-not $start) { throw "В CHANGELOG.md нет раздела для $version" }
          $notes = @()
          foreach ($line in $lines[$start..($lines.Length - 1)]) {
            if ($line -match '^## ') { break }
            $notes += $line
          }
          $hash = (Get-Content dist/scarp-wallpaper.exe.sha256).Split(' ')[0]
          $notes += ''
          $notes += '### Скачать'
          $notes += ''
          $notes += '`scarp-wallpaper.exe` ниже: один файл, установка не нужна. Windows 10 1903+ или Windows 11, x64.'
          $notes += ''
          $notes += "SHA256: ``$hash``"
          ($notes -join "`n").Trim() | Set-Content -Encoding utf8 notes.md
          Get-Content notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.version.outputs.tag }}"
          dist/scarp-wallpaper.exe dist/scarp-wallpaper.exe.sha256
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --title "SCARP WALLPAPER ${{ steps.version.outputs.version }}"
          --notes-file notes.md
